<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample Gym postcode finder</title></head><body><div id="app"></div><script>const DATA = {"ZZ1 1AA": ["Sample Gym Ashford", "1 High Street, Ashford", "0113 496 0000", "07:00 to 21:00"], "ZZ9 9ZZ": ["Sample Gym Yarford", "47 Bridge Street, Yarford", "0113 496 0023", "06:00 to 22:00"]};
document.getElementById('app').innerHTML='<h1>Find your nearest Sample Gym</h1><input id="pc" placeholder="Postcode"><button id="go">Search</button><div id="res"></div>';document.getElementById('go').onclick=()=>{const b=DATA[document.getElementById('pc').value.trim().toUpperCase()];document.getElementById('res').innerHTML=b?'<h2>'+b[0]+'</h2><p>'+b[1]+'</p>':'<p>No branch near that postcode.</p>';};</script><footer><p>Fictional test page for a scraper benchmark. Every name, price and address here is made up.</p></footer></body></html>
